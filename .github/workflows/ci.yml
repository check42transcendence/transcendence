name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: transcendence
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: transcendence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcendence -d transcendence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://transcendence:ci_only@localhost:5432/transcendence

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: End-to-end tests
        run: npm run test:e2e

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend
      - backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate local TLS certificate
        run: sh scripts/generate-local-cert.sh

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and start application
        run: >
          docker compose
          --env-file .env.example
          up --build --detach --wait --wait-timeout 120

      - name: Verify HTTP redirect
        run: |
          result="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' \
              'http://localhost:8080/api/health?check=ci'
          )"

          test "$result" = '308 https://localhost:8443/api/health?check=ci'

      - name: Verify frontend over HTTPS
        run: >
          curl
          --cacert certs/localhost.crt
          --fail
          --show-error
          --silent
          https://localhost:8443/
          > /dev/null

      - name: Verify backend through HTTPS gateway
        run: |
          response="$(
            curl \
              --cacert certs/localhost.crt \
              --fail \
              --show-error \
              --silent \
              https://localhost:8443/api/health
          )"

          test "$response" = '{"status":"ok"}'

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.example ps

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Shut down application
        if: always()
        run: >
          docker compose
          --env-file .env.example
          down --volumes --remove-orphans
